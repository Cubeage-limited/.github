name: self-hosted-runners
description: >
  Fail when any workflow in the repository can run on a runner that costs
  GitHub money: a private repository must use our own runners; a public one may
  also use GitHub's free standard hosted runners; larger and GPU runners are
  never allowed (zero GitHub spend, owner#750).
inputs:
  visibility:
    description: >
      "private" or "public". Defaults to the triggering repository's visibility;
      anything else is treated as private.
    required: false
    default: ${{ github.event.repository.private == false && 'public' || 'private' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
    - shell: bash
      run: python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2
    - shell: bash
      env:
        VISIBILITY: ${{ inputs.visibility }}
      run: python3 "$GITHUB_ACTION_PATH/check_runners.py" "$GITHUB_WORKSPACE" --visibility "$VISIBILITY"
